<nav class="bg-slate-900/95 backdrop-blur border-b border-white/10 sticky top-0 z-50">
  <div class="container section-x flex items-center justify-between h-16">
    <a href="#" class="flex items-center gap-2 shrink-0">
      <i class="fas fa-code text-brand-light"></i>
      <span class="text-lg font-bold text-white tracking-wide">Kirandeep Kaur</span>
    </a>

    <ul class="hidden lg:flex items-center gap-1">
      @for (link of links; track link.id) {
        <li>
          <a
            [href]="'#' + link.id"
            class="block px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 transition-colors duration-200"
            [ngClass]="{ 'text-white bg-white/10': isActive(link.id) }"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>

    <a
      href="Kirandeep_Kaur_Resume.pdf"
      download
      class="hidden lg:inline-flex items-center gap-2 bg-brand hover:bg-brand-dark text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors duration-200"
    >
      <i class="fas fa-download text-xs"></i>
      Resume
    </a>

    <button
      type="button"
      (click)="isMenuOpen = !isMenuOpen"
      class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-md text-slate-300 hover:text-white hover:bg-white/5 transition-colors"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="mobile-menu"
      aria-label="Toggle navigation menu"
    >
      <i class="fas text-lg" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
    </button>
  </div>

  @if (isMenuOpen) {
    <div id="mobile-menu" class="lg:hidden border-t border-white/10 bg-slate-900">
      <ul class="section-x py-2 space-y-1">
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              (click)="isMenuOpen = false"
              class="block px-3 py-2.5 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-white/5 transition-colors duration-200"
              [ngClass]="{ 'text-white bg-white/10': isActive(link.id) }"
            >
              {{ link.label }}
            </a>
          </li>
        }
        <li class="pt-2">
          <a
            href="Kirandeep_Kaur_Resume.pdf"
            download
            class="flex items-center justify-center gap-2 bg-brand hover:bg-brand-dark text-white text-sm font-semibold px-4 py-2.5 rounded-md transition-colors duration-200"
          >
            <i class="fas fa-download text-xs"></i>
            Download Resume
          </a>
        </li>
      </ul>
    </div>
  }
</nav>
