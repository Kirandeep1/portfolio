<section id="work-experience" class="bg-slate-50 section-y section-x">
  <div class="container">
    <div class="text-center mb-12">
      <h2 class="text-3xl font-bold text-slate-900">Work Experience</h2>
      <div class="w-16 h-1 bg-brand rounded-full mx-auto mt-3"></div>
    </div>

    <div class="relative max-w-3xl mx-auto">
      <div class="absolute left-[9px] top-2 bottom-2 w-px bg-slate-200" aria-hidden="true"></div>

      <div class="space-y-10">
        @for (role of roles; track role.title) {
          <div class="relative pl-10">
            <span class="absolute left-0 top-1.5 w-5 h-5 rounded-full bg-brand/15 border-2 border-brand flex items-center justify-center">
              <span class="w-2 h-2 rounded-full bg-brand"></span>
            </span>

            <div class="bg-white p-6 shadow-sm border border-slate-100 rounded-xl hover:shadow-md transition-shadow duration-300">
              <div class="flex flex-wrap justify-between items-baseline gap-2 mb-1">
                <h3 class="text-xl font-semibold text-slate-900">{{ role.title }}</h3>
                <span class="text-xs font-medium text-brand-dark bg-brand/10 rounded-full px-3 py-1">{{ role.duration }}</span>
              </div>
              <p class="text-slate-500 font-medium mb-4">{{ role.company }}</p>
              <ul class="space-y-2">
                @for (task of role.responsibilities; track $index) {
                  <li class="flex gap-2 text-slate-600 leading-relaxed">
                    <i class="fas fa-check text-brand text-xs mt-1.5"></i>
                    <span>{{ task }}</span>
                  </li>
                }
              </ul>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
