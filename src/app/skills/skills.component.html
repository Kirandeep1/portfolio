<section id="skills" class="bg-white section-y section-x">
  <div class="container">
    <div class="text-center mb-12">
      <h2 class="text-3xl font-bold text-slate-900">Skills</h2>
      <div class="w-16 h-1 bg-brand rounded-full mx-auto mt-3"></div>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (group of skillGroups; track group.category) {
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-6">
          <h3 class="text-sm font-semibold uppercase tracking-wide text-brand-dark mb-4">{{ group.category }}</h3>
          <div class="flex flex-wrap gap-2">
            @for (item of group.items; track item) {
              <span class="text-sm text-slate-700 bg-white border border-slate-200 rounded-full px-3 py-1.5">{{ item }}</span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
